name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Read version from the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer and portable build
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PerchSetup-*.exe
            dist/Perch.exe
          generate_release_notes: true
